[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "relaypilot"
version = "0.1.0"
description = "A safety-first Windows desktop task agent"
requires-python = ">=3.11"
authors = [{name = "Perumal Marimuthu"}]

[project.scripts]
relaypilot = "relaypilot.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

